<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼케이스 녹음 출석</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .session-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .session-btn {
            padding: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            background-color: #fff;
            transition: all 0.2s ease;
        }
        .session-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .session-btn.selected {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        /* 모달 스타일 생략 및 기본 버튼 */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ 쇼케이스 녹음 출석</h2>
    
    <form id="attendanceForm" onsubmit="handleSubmit(event)">
        <!-- 1. 세션 파트 선택 -->
        <div class="form-group">
            <label>1. 세션 파트 선택</label>
            <div class="session-grid" id="sessionGrid">
                <div class="session-btn" onclick="selectSession('보컬')">보컬</div>
                <div class="session-btn" onclick="selectSession('코러스')">코러스</div>
                <div class="session-btn" onclick="selectSession('베이스')">베이스</div>
                <div class="session-btn" onclick="selectSession('드럼')">드럼</div>
                <div class="session-btn" onclick="selectSession('건반')">건반</div>
                <div class="session-btn" onclick="selectSession('학생회')" style="grid-column: span 3;">학생회</div>
            </div>
        </div>

        <!-- 2. 이름 및 학번 입력 -->
        <div class="form-group">
            <label>2. 이름</label>
            <input type="text" id="studentName" placeholder="이름을 입력하세요" required>
        </div>
        <div class="form-group">
            <label>3. 학번</label>
            <input type="text" id="studentId" placeholder="학번을 입력하세요 (예: 20261234)" required>
        </div>

        <button type="submit" class="submit-btn">출석 등록하기</button>
    </form>
</div>

<!-- 자동완성 모달 영역 (필요시 구현부 연동) -->
<div id="autoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div style="background:white; padding:20px; border-radius:10px; width:300px;">
        <h3 id="autoModalTitle">🎵 명단 선택</h3>
        <div id="autoModalBody"></div>
        <button onclick="closeAutoCompleteModal()" style="margin-top:10px; width:100%; padding:8px;">닫기</button>
    </div>
</div>

<script>
    // 미리 등록된 세션 파트별 학생 데이터 (기타 삭제, 학생회 7명 포함)
    const MEMBER_DATABASE = [
        { name: "최세원", studentId: "202102444", part: "드럼" },
        { name: "김윤지", studentId: "202502107", part: "건반" },
        { name: "백서연", studentId: "202502205", part: "건반" },
        { name: "최예진", studentId: "202502531", part: "베이스" },
        { name: "임예림", studentId: "202502393", part: "건반" },

        // 학생회 명단 (7명)
        { name: "고효원", studentId: "202502019", part: "학생회" },
        { name: "나혜민", studentId: "202502139", part: "학생회" },
        { name: "이현수", studentId: "202502382", part: "학생회" },
        { name: "임지우", studentId: "202502400", part: "학생회" },
        { name: "정은서", studentId: "202502450", part: "학생회" },
        { name: "한민서", studentId: "202502500", part: "학생회" },
        { name: "황수빈", studentId: "202502528", part: "학생회" }
    ];

    let selectedSessionPart = '';

    function selectSession(part) {
        selectedSessionPart = part;
        document.querySelectorAll('.session-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.innerText.trim() === part);
        });

        const matchedMembers = MEMBER_DATABASE.filter(m => m.part === part);

        if (matchedMembers.length > 0) {
            showAutoCompleteModal(part, matchedMembers);
        }
    }

    function showAutoCompleteModal(partName, members) {
        const modal = document.getElementById('autoModal');
        const modalTitle = document.getElementById('autoModalTitle');
        const modalBody = document.getElementById('autoModalBody');

        modalTitle.innerText = `🎵 [${partName}] 명단 선택`;
        modalBody.innerHTML = '';

        members.forEach(m => {
            const item = document.createElement('div');
            item.style.padding = '8px';
            item.style.cursor = 'pointer';
            item.style.borderBottom = '1px solid #eee';
            item.innerText = `${m.name} (${m.studentId})`;
            item.onclick = () => {
                document.getElementById('studentName').value = m.name;
                document.getElementById('studentId').value = m.studentId;
                closeAutoCompleteModal();
            };
            modalBody.appendChild(item);
        });

        modal.style.display = 'flex';
    }

    function closeAutoCompleteModal() {
        document.getElementById('autoModal').style.display = 'none';
    }

    function handleSubmit(event) {
        event.preventDefault();
        const name = document.getElementById('studentName').value;
        const studentId = document.getElementById('studentId').value;
        alert(`출석 등록 완료!\n파트: ${selectedSessionPart}\n이름: ${name}\n학번: ${studentId}`);
    }
</script>

</body>
</html>
